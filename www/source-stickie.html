<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>便签</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  html, body { height: 100%; background: transparent; overflow: hidden; }

  :root { --ctl: #f8d67a; }

  /* 整个便签（透明窗口内唯一实体） */
  #stickie {
    position: absolute; inset: 0;
    background: #FDAF3C;              /* sticky 主体色 */
    border-radius: 6px;
    display: flex; flex-direction: column;
    box-shadow: 0 12px 30px rgba(0,0,0,.35);
    transition: background .2s, opacity .2s;
    overflow: hidden;
  }

  /* 脊部（顶部条带） */
  #spine {
    height: 26px; flex: 0 0 26px;
    display: flex; align-items: center; gap: 6px;
    padding: 0 8px; cursor: grab;
    transition: background-color .2s, opacity .2s;
    background: #FFEDBE;
  }
  #spine.inactive { background: rgba(0,0,0,.05); }  /* 失焦透脊（fnd_15） */
  #spine:active { cursor: grabbing; }

  #title {
    flex: 1; font-size: 11px; color: rgba(0,0,0,.55);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* 控制按钮（自定义绘制，fnd_13） */
  .ctrl {
    width: 13px; height: 13px; border-radius: 50%;
    position: relative; cursor: pointer; flex: 0 0 auto;
    transition: transform .12s; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12);
  }
  .ctrl:hover { transform: scale(1.25); }
  .ctrl svg { position: absolute; inset: 2.5px; width: 8px; height: 8px; }
  #btnClose { background: #f25f5c; }
  #btnZoom  { background: #f0b13c; }
  #btnCollapse { background: #55b884; }
  body.inactive .ctrl { opacity: 0; pointer-events: none; }  /* 失焦隐藏按钮 */

  /* 正文（富文本编辑区） */
  #body { flex: 1; min-height: 0; position: relative; display: flex; flex-direction: column; }
  #editor {
    flex: 1; overflow: auto; padding: 12px 14px 16px;
    font: 14px/1.55 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #1d1d1f; outline: none; user-select: text; cursor: text;
    background: #FFE9C9;
    transition: background .2s;
    word-break: break-word;
  }
  #editor:empty::before { content: "开始记录…"; color: rgba(0,0,0,.28); }

  /* 折叠态：只剩脊部 */
  body.collapsed #body { display: none; }

  /* 工具栏（悬浮出现） */
  #toolbar {
    position: absolute; right: 8px; bottom: 8px; z-index: 5;
    display: flex; gap: 4px; align-items: center; padding: 4px 6px;
    background: rgba(255,255,255,.8); border-radius: 8px;
    backdrop-filter: blur(6px); box-shadow: 0 2px 10px rgba(0,0,0,.15);
    opacity: 0; transform: translateY(4px); transition: all .15s;
  }
  #toolbar.show { opacity: 1; transform: translateY(0); }
  body.inactive #toolbar { display: none; }
  #toolbar button {
    width: 24px; height: 24px; border: none; border-radius: 6px;
    background: transparent; cursor: pointer; font-size: 13px; color: #333;
    display: grid; place-items: center;
  }
  #toolbar button:hover { background: rgba(0,0,0,.08); }
  #toolbar button.on { background: var(--ctl); color: #fff; }
  .sep { width: 1px; height: 16px; background: rgba(0,0,0,.12); }

  #swatches { display: flex; gap: 3px; align-items: center; }
  .swatch {
    width: 13px; height: 13px; border-radius: 50%; cursor: pointer;
    border: 1px solid rgba(0,0,0,.25); transition: transform .1s;
  }
  .swatch:hover { transform: scale(1.2); }
  .swatch.on { outline: 2px solid rgba(0,0,0,.5); outline-offset: 1px; }

  /* 查找面板（隐藏，⌘F 打开） */
  #findPanel {
    position: absolute; left: 8px; right: 8px; top: 30px; z-index: 20;
    background: rgba(255,255,255,.95); border-radius: 8px;
    box-shadow: 0 4px 16px rgba(0,0,0,.2);
    padding: 8px; display: none; font-size: 12px; color: #333;
    flex-direction: column; gap: 5px;
  }
  #findPanel.open { display: flex; }
  #findPanel input[type=text] {
    width: 100%; padding: 4px 8px; border: 1px solid #ccc; border-radius: 5px;
    font-size: 12px; outline: none; user-select: text; cursor: text;
  }
  #findPanel input[type=text]:focus { border-color: #f0a93c; }
  #findPanel .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  #findPanel label { display: flex; gap: 3px; align-items: center; white-space: nowrap; }
  #findPanel button {
    padding: 2px 8px; border: 1px solid #ccc; border-radius: 5px;
    background: #fff; cursor: pointer; font-size: 11px;
  }
  #findPanel button:hover { background: #f0f0f2; }
  #findPanel button.primary { background: #f0a93c; border-color: #f0a93c; color: #fff; }
  #findPanel .status { font-size: 11px; color: #777; min-height: 14px; }
</style>
</head>
<body>
  <div id="stickie">
    <div id="spine">
      <div class="ctrl" id="btnClose" title="关闭">
        <svg viewBox="0 0 10 10"><path d="M1 1 L9 9 M9 1 L1 9" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg>
      </div>
      <div class="ctrl" id="btnZoom" title="折叠/展开">
        <svg viewBox="0 0 10 10"><path d="M2 6.5 L5 3 L8 6.5" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="ctrl" id="btnCollapse" title="折叠">
        <svg viewBox="0 0 10 10"><path d="M2 4 L5 7.4 L8 4" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div id="title">便签</div>
    </div>
    <div id="body">
      <div id="editor" contenteditable="true" spellcheck="true"></div>
      <div id="toolbar">
        <div id="swatches" title="颜色"></div>
        <div class="sep"></div>
        <button id="btnStrike" title="删除线">S̶</button>
        <button id="btnPin" title="置顶">📌</button>
        <button id="btnGlass" title="半透明">💧</button>
      </div>

      <!-- 查找/替换面板（fnd_16/19） -->
      <div id="findPanel">
        <input type="text" id="findInput" placeholder="查找…" autocomplete="off">
        <input type="text" id="replaceInput" placeholder="替换为…" autocomplete="off">
        <div class="row">
          <label><input type="checkbox" id="findScopeAll"> 全部便签</label>
          <label>忽略大小写 <input type="checkbox" id="findIgnoreCase"></label>
          <span style="flex:1"></span>
          <button id="findClose">✕</button>
        </div>
        <div class="row">
          <button id="findPrev">⬆ 上一个</button>
          <button id="findNext" class="primary">⬇ 下一个</button>
          <button id="findReplace">替换</button>
          <button id="findReplaceAll">全部替换</button>
        </div>
        <div class="status" id="findStatus"></div>
      </div>
    </div>
  </div>
  <script src="stickie.js"></script>
</body>
</html>
