<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="便签">
<title>Stickies</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root { --ctl: #f8d67a; }
  html, body {
    height: 100%; background: #f2f0eb; overflow: hidden;
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    user-select: none; -webkit-user-select: none; touch-action: manipulation;
  }
  #topbar {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 16px 10px; padding-top: calc(14px + env(safe-area-inset-top));
    background: rgba(255,255,255,.85); backdrop-filter: blur(16px);
    position: sticky; top: 0; z-index: 50;
  }
  #topbar h1 { font-size: 22px; font-weight: 700; color: #1d1d1f; flex: 1; }
  #topbar h1 em { font-style: normal; color: #FDAF3C; }
  #topbar button {
    border: none; background: none; font-size: 15px; padding: 6px 10px;
    border-radius: 8px; color: #007aff; font-weight: 600; cursor: pointer;
  }
  .pill { background: rgba(0,122,255,.1); border-radius: 16px; }

  /* 便签墙网格 */
  #wall {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;
    padding: 12px 16px calc(80px + env(safe-area-inset-bottom));
    overflow-y: auto; height: calc(100% - 60px); overscroll-behavior: contain;
  }
  .card {
    min-height: 140px; border-radius: 10px; padding: 12px;
    position: relative; box-shadow: 0 2px 10px rgba(0,0,0,.08);
    display: flex; flex-direction: column; cursor: pointer;
    transition: transform .12s;
    animation: pop .25s cubic-bezier(.2,.9,.3,1.2);
    overflow: hidden;
  }
  @keyframes pop { from { transform: scale(.9); opacity: 0; } }
  .card:active { transform: scale(.97); }
  .card.blue   { background: #5AC8FA; }
  .card.green  { background: #63D98A; }
  .card.pink   { background: #FF9EB5; }
  .card.purple { background: #B78EFF; }
  .card.gray   { background: #8E8E93; }
  .card.yellow { background: #FDAF3C; }
  .card .spine {
    height: 4px; border-radius: 2px; margin-bottom: 8px;
    background: rgba(0,0,0,.15);
  }
  .card .title { font-size: 13px; font-weight: 600; color: rgba(0,0,0,.55); margin-bottom: 6px; }
  .card .preview {
    font-size: 13px; color: #1d1d1f; line-height: 1.4; flex: 1;
    overflow: hidden; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical;
    word-break: break-word;
  }
  .card .del {
    position: absolute; top: 8px; right: 8px; width: 20px; height: 20px;
    border-radius: 50%; background: rgba(0,0,0,.18); color: #fff;
    display: grid; place-items: center; font-size: 12px; display: none;
  }
  .card.editing .del { display: grid; }

  /* 底部新建按钮 */
  #fab {
    position: fixed; bottom: calc(20px + env(safe-area-inset-bottom)); left: 50%;
    transform: translateX(-50%);
    width: 56px; height: 56px; border-radius: 50%;
    background: #FDAF3C; color: #fff; border: none; font-size: 28px;
    box-shadow: 0 8px 24px rgba(0,0,0,.25); cursor: pointer; z-index: 60;
    transition: transform .12s;
  }
  #fab:active { transform: translateX(-50%) scale(.92); }

  /* 编辑模式（全屏便签） */
  #editorScreen {
    position: fixed; inset: 0; z-index: 100; display: none; flex-direction: column;
    background: #FFE9C9;
  }
  #editorScreen.open { display: flex; }
  #editorScreen .bar {
    display: flex; align-items: center; gap: 8px; padding: 12px 14px;
    padding-top: calc(12px + env(safe-area-inset-top));
    background: rgba(255,255,255,.7); backdrop-filter: blur(12px);
  }
  #editorScreen .bar input#editTitle {
    flex: 1; border: none; background: transparent; font-size: 17px; font-weight: 600;
    outline: none; color: #1d1d1f; min-width: 0;
  }
  #editorScreen .bar button {
    border: none; background: none; font-size: 15px; color: #007aff; font-weight: 600;
    padding: 6px 8px; border-radius: 8px;
  }
  #editorScreen .colors {
    display: flex; gap: 8px; padding: 8px 14px; background: rgba(255,255,255,.5);
  }
  .colorDot {
    width: 26px; height: 26px; border-radius: 50%; border: 2px solid transparent;
    cursor: pointer; transition: transform .1s;
  }
  .colorDot.on { border-color: #fff; box-shadow: 0 0 0 2px rgba(0,0,0,.3); }
  #editorScreen .body {
    flex: 1; display: flex; flex-direction: column; overflow: hidden;
    padding: 0 14px calc(20px + env(safe-area-inset-bottom));
  }
  #editorScreen textarea {
    flex: 1; border: none; background: transparent; resize: none; outline: none;
    font-size: 16px; line-height: 1.6; color: #1d1d1f; user-select: text;
    -webkit-user-select: text;
  }
  #empty {
    position: absolute; inset: 60px 0 0; display: grid; place-items: center;
    color: rgba(0,0,0,.3); font-size: 15px; text-align: center; pointer-events: none;
  }
  #toast {
    position: fixed; bottom: calc(90px + env(safe-area-inset-bottom)); left: 50%;
    transform: translateX(-50%) translateY(10px); background: rgba(0,0,0,.8);
    color: #fff; padding: 8px 16px; border-radius: 16px; font-size: 13px;
    opacity: 0; transition: all .25s; z-index: 200; pointer-events: none;
    white-space: nowrap;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
  <div id="topbar">
    <h1>📋 <em>Stickies</em></h1>
    <button id="searchBtn" class="pill">🔍</button>
    <button id="editModeBtn">✏️</button>
  </div>

  <div id="wall"></div>
  <div id="empty">
    <div>还没有便签<br>点下方 ➕ 开始记录</div>
  </div>

  <button id="fab">＋</button>

  <!-- 编辑全屏 -->
  <div id="editorScreen">
    <div class="bar">
      <button id="backBtn">‹ 返回</button>
      <input id="editTitle" placeholder="便签标题" maxlength="40">
      <button id="saveBtn">保存</button>
    </div>
    <div class="colors" id="colorRow"></div>
    <div class="body">
      <textarea id="editText" placeholder="开始记录…" spellcheck="true"></textarea>
    </div>
  </div>

  <div id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
