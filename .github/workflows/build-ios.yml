name: Build iOS (Stickies)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build & Export Stickies.ipa
    runs-on: macos-15          # macOS 15 runner（新版 Xcode）
    permissions:
      contents: write          # 允许把诊断日志提交回仓库
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Select Xcode
        run: xcodebuild -version

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          npx cap sync ios

      # ── 探测签名材料（兼容多种 Secret 命名）────────────────────
      # 任何一种组合存在即可走签名分支：
      #   Apple ID 凭据：APPLE_ID / APPLE_ID_USER / APPLE_EMAIL / APPLE_USERNAME
      #                 + APPLE_ID_PASSWORD / APPLE_PASSWORD / APPLE_APP_SPECIFIC_PASSWORD
      #   p12 证书：     CERTIFICATE_BASE64 / CERT_P12_BASE64 / DEV_CERT_BASE64
      - name: Detect signing material
        id: detect
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_USER: ${{ secrets.APPLE_ID_USER }}
          APPLE_EMAIL: ${{ secrets.APPLE_EMAIL }}
          APPLE_USERNAME: ${{ secrets.APPLE_USERNAME }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          CERTIFICATE_BASE64: ${{ secrets.CERTIFICATE_BASE64 }}
          CERT_P12_BASE64: ${{ secrets.CERT_P12_BASE64 }}
          DEV_CERT_BASE64: ${{ secrets.DEV_CERT_BASE64 }}
        run: |
          set -e
          # 选出第一个非空的 Apple ID
          ID_VALUE=""
          for v in "$APPLE_ID" "$APPLE_ID_USER" "$APPLE_EMAIL" "$APPLE_USERNAME"; do
            if [ -n "$v" ]; then ID_VALUE="$v"; break; fi
          done
          # 选出第一个非空的密码
          PW_VALUE=""
          for v in "$APPLE_ID_PASSWORD" "$APPLE_PASSWORD" "$APPLE_APP_SPECIFIC_PASSWORD"; do
            if [ -n "$v" ]; then PW_VALUE="$v"; break; fi
          done
          # 选出第一个非空的证书
          CERT_VALUE=""
          for v in "$CERTIFICATE_BASE64" "$CERT_P12_BASE64" "$DEV_CERT_BASE64"; do
            if [ -n "$v" ]; then CERT_VALUE="$v"; break; fi
          done

          {
            echo "apple_id=${ID_VALUE}"
            echo "has_apple_id=$([ -n "$ID_VALUE" ] && echo true || echo false)"
            echo "has_password=$([ -n "$PW_VALUE" ] && echo true || echo false)"
            echo "has_cert=$([ -n "$CERT_VALUE" ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

          echo "Apple ID 凭据: $([ -n "$ID_VALUE" ] && echo '✅ 有' || echo '❌ 无')"
          echo "密码:         $([ -n "$PW_VALUE" ] && echo '✅ 有' || echo '❌ 无')"
          echo "p12 证书:     $([ -n "$CERT_VALUE" ] && echo '✅ 有' || echo '❌ 无')"
          echo "（提示：Secret 不可见属正常，这里只看长度非 0）"

          # 写入 Job Summary（任何人都可见，便于诊断）
          {
            echo "## 🔐 签名材料探测结果"
            echo ""
            echo "| 项目 | 状态 |"
            echo "|---|---|"
            echo "| Apple ID 凭据 | $([ -n "$ID_VALUE" ] && echo '✅ 已配置' || echo '❌ 缺失') |"
            echo "| 密码 | $([ -n "$PW_VALUE" ] && echo '✅ 已配置' || echo '❌ 缺失') |"
            echo "| p12 证书 | $([ -n "$CERT_VALUE" ] && echo '✅ 已配置' || echo '❌ 缺失') |"
            echo ""
            echo "若全部缺失，请在仓库 Settings → Secrets and variables → Actions 添加（名称任选其一即可被自动识别）："
            echo ""
            echo "- Apple ID：\`APPLE_ID\` / \`APPLE_ID_USER\` / \`APPLE_EMAIL\` / \`APPLE_USERNAME\`"
            echo "- 密码：\`APPLE_ID_PASSWORD\` / \`APPLE_PASSWORD\` / \`APPLE_APP_SPECIFIC_PASSWORD\`"
            echo "- Team：\`TEAM_ID\`"
            echo "- 或 p12：\`CERTIFICATE_BASE64\` + \`CERTIFICATE_PASSWORD\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install fastlane
        if: steps.detect.outputs.has_apple_id == 'true'
        run: |
          sudo gem install fastlane -N --no-document
          fastlane --version

      # ── 方式 A：Apple ID 自动生成证书+描述文件（私钥在 CI 本地创建）──
      - name: Generate cert & profile via Apple ID
        id: fastlane
        if: steps.detect.outputs.has_apple_id == 'true' && steps.detect.outputs.has_password == 'true'
        continue-on-error: true
        env:
          FASTLANE_USER: ${{ steps.detect.outputs.apple_id }}
          FASTLANE_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD || secrets.APPLE_PASSWORD || secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD || secrets.APPLE_PASSWORD || secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          FASTLANE_SESSION: ${{ secrets.FASTLANE_SESSION }}
          FASTLANE_TEAM_ID: ${{ secrets.TEAM_ID }}
          FASTLANE_SKIP_UPDATE_CHECK: "true"
          FASTLANE_HIDE_CHANGELOG: "true"
          FASTLANE_OPT_OUT_USAGE: "true"
        run: |
          mkdir -p build/certs
          echo "### fastlane cert development" >> build/certs/fastlane.log
          fastlane cert development \
            --keychain_path "$HOME/Library/Keychains/login.keychain-db" \
            --output_directory build/certs \
            --force \
            >> build/certs/fastlane.log 2>&1
          CERT_RC=$?
          echo "### fastlane sigh development" >> build/certs/fastlane.log
          fastlane sigh development \
            --bundle_id com.example.StickiesIOS \
            --keychain_path "$HOME/Library/Keychains/login.keychain-db" \
            --output_path build/certs \
            --force \
            >> build/certs/fastlane.log 2>&1
          SIGH_RC=$?
          echo "cert_rc=$CERT_RC" >> "$GITHUB_OUTPUT"
          echo "sigh_rc=$SIGH_RC" >> "$GITHUB_OUTPUT"

          {
            echo "## 🔐 fastlane 证书生成结果"
            echo ""
            echo "- fastlane cert 退出码: \`$CERT_RC\`"
            echo "- fastlane sigh 退出码: \`$SIGH_RC\`"
            echo ""
            echo "### 日志尾部"
            echo ""
            echo '```'
            tail -60 build/certs/fastlane.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$CERT_RC" -ne 0 ] || [ "$SIGH_RC" -ne 0 ]; then
            echo "::error::fastlane 证书/描述文件生成失败（cert=$CERT_RC sigh=$SIGH_RC），详见 Job Summary"
            exit 1
          fi

      # ── 方式 B：p12 证书导入 ──
      - name: Import p12 certificate
        if: steps.detect.outputs.has_apple_id != 'true' && steps.detect.outputs.has_cert == 'true'
        env:
          CERTIFICATE_BASE64: ${{ secrets.CERTIFICATE_BASE64 || secrets.CERT_P12_BASE64 || secrets.DEV_CERT_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD || secrets.P12_PASSWORD }}
        run: |
          set -e
          echo "$CERTIFICATE_BASE64" | base64 --decode > /tmp/cert.p12
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          security create-keychain -p temp "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p temp "$KEYCHAIN"
          security import /tmp/cert.p12 -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple: -s -k temp "$KEYCHAIN"

      # ── 签名构建 + 导出 ipa ──
      - name: Build & export IPA (signed)
        id: signbuild
        if: (steps.detect.outputs.has_apple_id == 'true' && steps.detect.outputs.has_password == 'true') || steps.detect.outputs.has_cert == 'true'
        continue-on-error: true
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          mkdir -p build/logs
          set +e

          # ExportOptions.plist —— method=development 是【导出选项】，不是 build action
          cat > /tmp/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>development</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          PLIST

          # 第一步 archive（构建 + 签名）
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Stickies.xcarchive" \
            -allowProvisioningUpdates \
            DEVELOPMENT_TEAM="${TEAM_ID}" \
            archive > build/logs/archive.log 2>&1
          ARC_RC=$?
          echo "archive_rc=$ARC_RC" >> "$GITHUB_OUTPUT"

          # 第二步 exportArchive（导出 ipa）
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Stickies.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -allowProvisioningUpdates > build/logs/export.log 2>&1
          EXP_RC=$?
          echo "export_rc=$EXP_RC" >> "$GITHUB_OUTPUT"

          {
            echo "## 🏗️ 签名构建结果"
            echo ""
            echo "- archive 退出码: \`$ARC_RC\`"
            echo "- export 退出码: \`$EXP_RC\`"
            echo ""
            echo "### archive.log 关键错误"
            echo ""
            echo '```'
            grep -iE "error|failed|unable|denied|no account|provisioning|profile|signing" build/logs/archive.log 2>/dev/null | tail -30 || tail -30 build/logs/archive.log 2>/dev/null
            echo '```'
            echo ""
            echo "### export.log 关键错误"
            echo ""
            echo '```'
            tail -40 build/logs/export.log 2>/dev/null || echo "(无 export 日志)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$ARC_RC" -ne 0 ] || [ "$EXP_RC" -ne 0 ]; then
            echo "::error::archive/export 失败（archive=$ARC_RC export=$EXP_RC），详见 Job Summary"
            exit 1
          fi

      - name: Build unsigned IPA
        if: steps.detect.outputs.has_apple_id != 'true' && steps.detect.outputs.has_cert != 'true'
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/ipa"
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/derived" \
            CODE_SIGNING_ALLOWED=NO build
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/derived/Build/Products/Release-iphoneos/App.app" \
                "$RUNNER_TEMP/ipa/Payload/Stickies.app"
          cd "$RUNNER_TEMP/ipa"
          zip -qr "$RUNNER_TEMP/ipa/Stickies-unsigned.ipa" Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stickies-ipa
          path: ${{ runner.temp }}/ipa/*.ipa
          if-no-files-found: error

      # ── 把诊断日志提交回仓库（公开可读，无需 API 认证）────────────
      # 放在最后：这样能同时拿到 fastlane / archive / export 三份日志
      - name: Commit diagnostics to repo
        if: always()
        run: |
          set +e
          mkdir -p .ci-logs
          if [ -f build/certs/fastlane.log ]; then
            cp build/certs/fastlane.log .ci-logs/fastlane.log
          else
            echo "no fastlane log produced" > .ci-logs/fastlane.log
          fi
          for lg in archive export; do
            if [ -f "build/logs/$lg.log" ]; then
              cp "build/logs/$lg.log" ".ci-logs/$lg.log"
            else
              echo "no $lg log produced" > ".ci-logs/$lg.log"
            fi
          done
          {
            echo "run: ${GITHUB_RUN_ID}"
            echo "commit: ${GITHUB_SHA}"
            echo "date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "apple_id_detected: ${{ steps.detect.outputs.has_apple_id }}"
            echo "password_detected: ${{ steps.detect.outputs.has_password }}"
            echo "cert_detected: ${{ steps.detect.outputs.has_cert }}"
            echo "archive_rc: ${{ steps.signbuild.outputs.archive_rc }}"
            echo "export_rc: ${{ steps.signbuild.outputs.export_rc }}"
          } > .ci-logs/meta.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .ci-logs
          git commit -m "ci: diagnostics for run ${GITHUB_RUN_ID}" 2>&1 | tail -2
          git push origin HEAD:${{ github.ref_name }} 2>&1 | tail -3
