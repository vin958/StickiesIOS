name: Build iOS (Stickies)

# 触发条件：推送到 main 或手动（workflow_dispatch 可在 Actions 页面点 Run）
on:
  push:
    branches: [main, master]
  workflow_dispatch:        # 手动触发

jobs:
  build-ipa:
    name: Build & Export Stickies.ipa
    runs-on: macos-15       # macOS 15 runner，自带新版 Xcode（支持 iOS 27 设备构建）
    env:
      # 已配置签名材料（任一满足即可走签名分支）
      HAS_CERT: ${{ secrets.CERTIFICATE_BASE64 != '' || secrets.APPLE_ID != '' }}

    steps:
      # 1. 检出代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 设置 Node.js（Capacitor 需要）
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3. 选择最新 Xcode
      - name: Select Xcode version
        run: |
          xcodebuild -version
          # macos-15 runner 默认最新 Xcode

      # 4. 安装依赖（Capacitor CLI + 插件）
      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          npx cap sync ios

      # 5. 配置签名（两种方式任选其一，均已支持）
      #    方式 A：Apple ID 凭据自动签名（推荐，无需手动导出证书）
      #       Secrets: APPLE_ID + APPLE_ID_PASSWORD (+ TEAM_ID)
      #    方式 B：证书 + 描述文件（p12 导入）
      #       Secrets: CERTIFICATE_BASE64 + CERTIFICATE_PASSWORD (+ TEAM_ID)
      #    方式 C：仅证书（xcodebuild 自动生成描述文件）
      #       Secrets: CERTIFICATE_BASE64 + CERTIFICATE_PASSWORD + TEAM_ID

      # 5a. Apple ID 凭据 → 存储为 xcodebuild 可用的环境（fastlane 无需；xcodebuild 直接读环境）
      - name: Configure Apple ID auth
        if: env.HAS_CERT == 'true'
        run: |
          # xcodebuild -allowProvisioningUpdates 会在首次构建时自动登录并创建证书/描述文件
          # Apple ID 凭据通过 Secrets 注入，无需写入文件
          echo "Apple ID sign-in enabled (automatic provisioning)"

      # 5b. 备用：p12 证书导入（方式 B/C 时用）
      - name: Import signing certificate (p12)
        env:
          CERTIFICATE_BASE64: ${{ secrets.CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        if: env.CERTIFICATE_BASE64 != ''
        run: |
          echo "$CERTIFICATE_BASE64" | base64 --decode > /tmp/cert.p12
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          security create-keychain -p temp "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p temp "$KEYCHAIN"
          security import /tmp/cert.p12 -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple: -s -k temp "$KEYCHAIN"

      # 5c. 备用：描述文件导入（方式 B 时用）
      - name: Install provisioning profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        if: env.PROVISIONING_PROFILE_BASE64 != ''
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/stickies.mobileprovision"

      # 6. 签名构建 + 导出 ipa
      - name: Build and export IPA (signed)
        if: env.HAS_CERT == 'true'
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
        run: |
          set -e
          echo "Building signed Stickies iOS (auto-provisioning)..."
          echo "TEAM_ID=${TEAM_ID} APPLE_ID=${APPLE_ID}"

          # 优先用 p12 证书（若提供）；否则纯 Apple ID 自动签名
          if [ -f /tmp/cert.p12 ]; then
            echo "Using p12 certificate"
          fi

          # ExportOptions（自动签名）
          cat > /tmp/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>development</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          PLIST

          # Archive（-allowProvisioningUpdates 自动登录 Apple ID 并创建证书/描述文件）
          if [ -n "$APPLE_ID" ]; then
            echo "Using Apple ID automatic provisioning"
            xcodebuild -project ios/App/App.xcodeproj \
              -scheme App -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath "$RUNNER_TEMP/Stickies.xcarchive" \
              -allowProvisioningUpdates \
              -allowProvisioningDeviceRegistration \
              archive
          else
            echo "Using p12 certificate signing"
            xcodebuild -project ios/App/App.xcodeproj \
              -scheme App -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath "$RUNNER_TEMP/Stickies.xcarchive" \
              -allowProvisioningUpdates \
              DEVELOPMENT_TEAM="$TEAM_ID" \
              archive
          fi

          # 导出 ipa
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Stickies.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -allowProvisioningUpdates

      # 7. 无签名材料的回退：编译未签名 ipa
      - name: Build unsigned IPA (no cert)
        if: env.HAS_CERT != 'true'
        run: |
          set -e
          echo "No signing material configured — building unsigned IPA"
          mkdir -p "$RUNNER_TEMP/ipa"
          APP="$RUNNER_TEMP/Stickies.app"
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/derived" \
            CODE_SIGNING_ALLOWED=NO build
          cp -R "$RUNNER_TEMP/derived/Build/Products/Release-iphoneos/App.app" "$APP"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/Stickies.app"
          cd "$RUNNER_TEMP/ipa"
          zip -qr "$RUNNER_TEMP/ipa/Stickies-unsigned.ipa" Payload
          cd -
          echo "Unsigned IPA ready: $RUNNER_TEMP/ipa/Stickies-unsigned.ipa"

      # 8. 上传 ipa 为构建产物
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stickies-ipa
          path: |
            ${{ runner.temp }}/ipa/*.ipa
            ${{ runner.temp }}/ipa/**/*.ipa
          if-no-files-found: error