name: Build iOS (Stickies)

# 触发条件：推送到 main 或手动（workflow_dispatch 可在 Actions 页面点 Run）
on:
  push:
    branches: [main, master]
  workflow_dispatch:        # 手动触发

jobs:
  build-ipa:
    name: Build & Export Stickies.ipa
    runs-on: macos-15       # macOS 15 runner，自带新版 Xcode（支持 iOS 27 设备构建）
    env:
      HAS_CERT: ${{ secrets.CERTIFICATE_BASE64 != '' }}

    steps:
      # 1. 检出代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 设置 Node.js（Capacitor 需要）
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3. 选择最新 Xcode（macos-15 runner 自带，这一步拿最高版本）
      - name: Select Xcode version
        run: |
          xcodebuild -version
          # 如有多个 Xcode，选择最新的（macos-15 默认已是最新）

      # 4. 安装依赖（Capacitor CLI + 插件）
      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          npx cap sync ios

      # 5. 导入签名证书（从 GitHub Secrets）
      #    需在仓库 Settings → Secrets 配置：
      #      CERTIFICATE_BASE64   — 开发者证书 .p12 的 base64
      #      CERTIFICATE_PASSWORD — .p12 密码
      #      PROVISIONING_PROFILE_BASE64 — 描述文件 .mobileprovision 的 base64
      #      TEAM_ID — 开发者 Team ID（如 ABCDE12345）
      #      BUNDLE_ID — 可选，默认 com.example.StickiesIOS
      - name: Import signing certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        if: env.CERTIFICATE_BASE64 != ''
        run: |
          # 证书文件
          echo "$CERTIFICATE_BASE64" | base64 --decode > /tmp/cert.p12
          # 导入钥匙串
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          security create-keychain -p temp "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p temp "$KEYCHAIN"
          security import /tmp/cert.p12 -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple: -s -k temp "$KEYCHAIN"
          echo "证书导入完成"
          security find-identity -v -p codesigning

      # 6. 安装描述文件
      - name: Install provisioning profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        if: env.PROVISIONING_PROFILE_BASE64 != ''
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/stickies.mobileprovision"
          echo "描述文件已安装"

      # 7. 构建 + 导出 ipa
      #    有证书：自动签名导出。无证书：编译未签名 ipa 供测试
      - name: Build and export IPA (signed)
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
          BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
        if: env.HAS_CERT == 'true'
        run: |
          set -e
          echo "Building signed Stickies iOS..."

          # ExportOptions（自动签名）
          cat > /tmp/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>development</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          PLIST

          # Archive（自动签名）
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Stickies.xcarchive" \
            -allowProvisioningUpdates \
            archive

          # 导出 ipa
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Stickies.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -allowProvisioningUpdates

      # 7b. 无证书时：编译未签名 ipa（可先验证流程）
      - name: Build unsigned IPA (no cert)
        if: env.HAS_CERT != 'true'
        run: |
          set -e
          echo "No cert configured — building unsigned IPA"
          mkdir -p "$RUNNER_TEMP/ipa"
          APP="$RUNNER_TEMP/Stickies.app"
          # 编译到临时路径
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/derived" \
            CODE_SIGNING_ALLOWED=NO build
          # 组装 Payload/ipa
          cp -R "$RUNNER_TEMP/derived/Build/Products/Release-iphoneos/App.app" "$APP"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/Stickies.app"
          cd "$RUNNER_TEMP/ipa"
          zip -qr "$RUNNER_TEMP/ipa/Stickies-unsigned.ipa" Payload
          cd -
          echo "Unsigned IPA ready: $RUNNER_TEMP/ipa/Stickies-unsigned.ipa"

      # 8. 上传 ipa 为构建产物
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stickies-ipa
          path: |
            ${{ runner.temp }}/ipa/*.ipa
            ${{ runner.temp }}/ipa/**/*.ipa
          if-no-files-found: error