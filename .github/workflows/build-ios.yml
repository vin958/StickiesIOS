name: Build iOS (Stickies)

# 触发条件：推送到 main 或手动（workflow_dispatch 可在 Actions 页面点 Run）
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build & Export Stickies.ipa
    runs-on: macos-15          # macOS 15 runner（新版 Xcode，可构建 iOS 27 设备）
    env:
      HAS_SIGNING: ${{ secrets.APPLE_ID != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Select Xcode
        run: xcodebuild -version

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          npx cap sync ios

      # ── fastlane：用 Apple ID 凭据在 CI 云端生成证书+描述文件 ──
      # 私钥在 runner 本地创建，不依赖任何本地导出，因此彻底绕开
      # macOS「钥匙串私钥不可导出」的限制。
      - name: Install fastlane
        if: env.HAS_SIGNING == 'true'
        run: |
          sudo gem install fastlane -N --no-document
          fastlane --version

      - name: Generate certificate & provisioning profile
        if: env.HAS_SIGNING == 'true'
        env:
          FASTLANE_USER: ${{ secrets.APPLE_ID }}
          FASTLANE_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          FASTLANE_TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          set -e
          mkdir -p build/certs

          echo "=== fastlane cert（创建/复用开发证书）==="
          fastlane cert development \
            --keychain_path "$HOME/Library/Keychains/login.keychain-db" \
            --output_directory build/certs

          echo "=== fastlane sigh（创建/复用描述文件）==="
          fastlane sigh development \
            --bundle_id com.example.StickiesIOS \
            --keychain_path "$HOME/Library/Keychains/login.keychain-db" \
            --output_path build/certs

          echo "=== 校验 ==="
          security find-identity -v -p codesigning
          ls "$HOME/Library/MobileDevice/Provisioning Profiles/"

      - name: Build & export IPA (signed)
        if: env.HAS_SIGNING == 'true'
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          set -e

          # ExportOptions.plist（注意：method=development 是导出选项，不是 build action）
          cat > /tmp/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>development</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          PLIST

          # 第一步：archive（构建+签名）
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Stickies.xcarchive" \
            -allowProvisioningUpdates \
            DEVELOPMENT_TEAM="${TEAM_ID}" \
            archive

          # 第二步：exportArchive（导出 ipa）
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Stickies.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -allowProvisioningUpdates

      - name: Build unsigned IPA (no Apple ID)
        if: env.HAS_SIGNING != 'true'
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/ipa"
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/derived" \
            CODE_SIGNING_ALLOWED=NO build
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/derived/Build/Products/Release-iphoneos/App.app" \
                "$RUNNER_TEMP/ipa/Payload/Stickies.app"
          cd "$RUNNER_TEMP/ipa"
          zip -qr "$RUNNER_TEMP/ipa/Stickies-unsigned.ipa" Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stickies-ipa
          path: ${{ runner.temp }}/ipa/*.ipa
          if-no-files-found: error